<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3e7">
  <title>慢慢骑 · 鹈鹕的海边散步</title>
  <style>
    :root { --paper:#f7f3e7; --ink:#293f43; --muted:#7b8580; --coral:#dc745a; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"Avenir Next","PingFang SC","Microsoft YaHei",sans-serif; }
    button,input { font:inherit; }
    button { -webkit-tap-highlight-color:transparent; }
    .page { min-height:100svh; max-width:1600px; margin:auto; padding:30px 48px 24px; display:flex; flex-direction:column; }
    .masthead { display:flex; justify-content:space-between; align-items:center; padding-bottom:22px; border-bottom:1px solid #293f4320; }
    .brand { display:flex; align-items:center; gap:12px; font-size:12px; font-weight:700; letter-spacing:2.7px; }
    .brand svg { width:30px; height:25px; }
    .edition { font-size:11px; letter-spacing:2px; color:var(--muted); }
    .stage { width:100%; position:relative; aspect-ratio:1440 / 820; max-height:calc(100svh - 180px); min-height:480px; flex:1; isolation:isolate; }
    .scene { display:block; width:100%; height:100%; overflow:hidden; }
    .heading { position:absolute; z-index:1; top:10%; left:5%; pointer-events:none; }
    .eyebrow { margin:0 0 17px; font-size:11px; letter-spacing:3px; font-weight:600; color:#9a7556; }
    h1 { margin:0; font-family:"Songti SC","Noto Serif CJK SC","STSong",serif; font-weight:600; font-size:clamp(40px,4.5vw,70px); line-height:1.3; letter-spacing:3px; }
    .subheading { margin:19px 0 0; color:var(--muted); font-size:12px; letter-spacing:2px; }
    .postmark { position:absolute; right:5.5%; top:9%; width:84px; height:84px; border:1px solid #9b947e70; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-direction:column; transform:rotate(12deg); color:#928871; gap:7px; }
    .postmark span { font-size:7px; letter-spacing:1.1px; white-space:nowrap; }
    .postmark b { font-family:Georgia,serif; font-size:24px; font-weight:400; }
    .footer { border-top:1px solid #293f4320; padding-top:21px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .caption { display:flex; align-items:center; gap:12px; font-size:11px; color:var(--muted); letter-spacing:1.2px; }
    .dot { width:6px; height:6px; border-radius:50%; background:#789486; box-shadow:0 0 0 4px #78948610; }
    .controls { display:flex; gap:10px; align-items:center; }
    .control { border:1px solid #293f4328; background:transparent; color:var(--ink); height:42px; border-radius:24px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:background .2s,transform .2s; }
    .control:hover { background:#ede9dc; transform:translateY(-1px); }
    .control:active { transform:translateY(1px); }
    .control:focus-visible,input:focus-visible { outline:2px solid var(--coral); outline-offset:4px; }
    .play { padding:0 17px; min-width:92px; font-size:12px; }
    .control svg { width:15px; height:15px; }
    .bell { width:42px; }
    .speed { display:flex; align-items:center; gap:10px; padding:0 13px; height:42px; border:1px solid #293f4328; border-radius:24px; }
    .speed label { font-size:11px; color:var(--muted); }
    .speed input { width:74px; height:3px; accent-color:var(--coral); cursor:pointer; }
    .speed output { font-size:10px; font-variant-numeric:tabular-nums; min-width:27px; }
    .toast { position:absolute; bottom:13%; left:58%; color:#a36a43; font-size:13px; letter-spacing:3px; opacity:0; transform:translateY(8px) rotate(-8deg); transition:opacity .2s,transform .4s; pointer-events:none; }
    .toast.show { opacity:1; transform:translateY(-12px) rotate(-8deg); }
    .pause-icon[hidden],.play-icon[hidden] { display:none; }
    @media(min-width:1600px) { .page { padding-top:40px; padding-bottom:30px; } }
    @media(max-width:800px) {
      .page { padding:23px 24px; }
      .stage { min-height:460px; max-height:none; aspect-ratio:1.35; }
      .heading { top:9%; left:3%; }
      h1 { font-size:40px; }
      .subheading { font-size:10px; letter-spacing:1px; }
      .postmark { width:67px; height:67px; right:2%; }
      .caption { font-size:10px; gap:8px; letter-spacing:.4px; }
    }
    @media(max-width:560px) {
      .page { padding:21px 20px 25px; }
      .masthead { padding-bottom:18px; }
      .brand { font-size:10px; gap:9px; letter-spacing:2px; }
      .edition { font-size:8px; letter-spacing:1px; }
      .stage { aspect-ratio:780 / 920; min-height:470px; }
      .heading { top:7%; left:2%; }
      h1 { font-size:37px; letter-spacing:2px; }
      .eyebrow { font-size:8px; letter-spacing:2px; margin-bottom:10px; }
      .subheading { margin-top:12px; font-size:10px; }
      .postmark { top:7%; width:58px; height:58px; gap:4px; }
      .postmark span { font-size:6px; }
      .postmark b { font-size:20px; }
      .footer { flex-direction:column-reverse; padding-top:20px; gap:24px; }
      .controls { justify-content:center; gap:9px; }
      .caption { font-size:10px; }
      .toast { bottom:18%; left:66%; }
    }
  </style>
</head>

  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !reducedMotion.matches;
      let speed = 1, elapsed = 0, lastTime = null, frameId = null;
      let audioContext, toastTimer;
      const nodes = Object.fromEntries([
        'wheel-rear','wheel-front','crank-slots','near-crank-arm','far-crank-arm',
        'leg-near-outline','leg-near-color','leg-far-outline','leg-far-color','foot-near','foot-far',
        'pelican','scarf-tail-back','scarf-tail-front','eye','closed-eye','wind-lines',
        'cloud-a','cloud-b','cloud-c','gull-a','gull-b','dunes','road','sea-ripples','plants-back','plants-front'
      ].map(id => [id, $(id)]));
      const wrap = (value, min, max) => ((value - min) % (max - min) + max - min) % (max - min) + min;
      const f = value => value.toFixed(2);

      // Solve two fixed-length leg segments to keep both webbed feet on the pedals.
      function poseLeg(side, phase, bob) {
        const near = side === 'near';
        const hip = {x:near ? 581 : 558, y:433 + bob};
        const pedal = {x:614 + 42 * Math.cos(phase), y:584 + 42 * Math.sin(phase)};
        const ankle = {x:pedal.x, y:pedal.y - (near ? 13 : 11)};
        const dx = ankle.x - hip.x, dy = ankle.y - hip.y;
        const d = Math.hypot(dx, dy);
        const upper = 103, lower = 108;
        const along = (upper * upper - lower * lower + d * d) / (2 * d);
        const perpendicular = Math.sqrt(Math.max(0, upper * upper - along * along));
        const knee = {x:hip.x + along * dx / d + perpendicular * dy / d, y:hip.y + along * dy / d - perpendicular * dx / d};
        const path = `M${f(hip.x)} ${f(hip.y)}L${f(knee.x)} ${f(knee.y)} ${f(ankle.x)} ${f(ankle.y)}`;
        nodes[`leg-${side}-outline`].setAttribute('d', path);
        nodes[`leg-${side}-color`].setAttribute('d', path);
        nodes[`foot-${side}`].setAttribute('transform', `translate(${f(ankle.x)} ${f(ankle.y)})`);
        nodes[`${near ? 'near' : 'far'}-crank-arm`].setAttribute('d', `M614 584L${f(pedal.x)} ${f(pedal.y)}`);
      }

      function render() {
        const wheelAngle = elapsed * 150 / 117;
        const phase = wheelAngle * 1.7 - .6;
        const bob = Math.sin(phase * 2) * 2.1;
        const degrees = wheelAngle * 180 / Math.PI;
        nodes['wheel-rear'].setAttribute('transform', `rotate(${f(degrees)})`);
        nodes['wheel-front'].setAttribute('transform', `rotate(${f(degrees)})`);
        nodes['crank-slots'].setAttribute('transform', `rotate(${f(phase * 180 / Math.PI)} 614 584)`);
        poseLeg('far', phase + Math.PI, bob);
        poseLeg('near', phase, bob);
        nodes.pelican.setAttribute('transform', `translate(0 ${f(bob)})`);
        const flutter = Math.sin(elapsed * 4.2) * 6;
        const flutter2 = Math.sin(elapsed * 4.2 - 1.5) * 5;
        nodes['scarf-tail-back'].setAttribute('d', `M626 333C591 ${322 + flutter2} 561 ${342 + flutter} 526 ${321 + flutter2}L504 ${326 + flutter2} 516 ${309 + flutter2}C553 ${332 + flutter} 589 ${309 + flutter2} 629 319Z`);
        nodes['scarf-tail-front'].setAttribute('d', `M631 339C594 ${345 + flutter2} 567 ${327 + flutter} 540 ${337 + flutter2}L524 ${354 + flutter2} 544 ${352 + flutter2}C571 ${342 + flutter} 600 ${365 + flutter2} 632 353Z`);
        const blink = elapsed % 5.7 > 5.5;
        nodes.eye.setAttribute('opacity', blink ? '0' : '1');
        nodes['closed-eye'].setAttribute('opacity', blink ? '1' : '0');
        nodes['wind-lines'].setAttribute('opacity', f(.4 + .2 * Math.sin(elapsed * 2)));
        nodes['wind-lines'].setAttribute('transform', `translate(${f(-10 * Math.sin(elapsed * 1.5))} 0)`);
        nodes['cloud-a'].setAttribute('transform', `translate(${f(wrap(784 - elapsed * 9,-180,1600))} 148) scale(.82)`);
        nodes['cloud-b'].setAttribute('transform', `translate(${f(wrap(1104 - elapsed * 13,-200,1650))} 355) scale(1.2)`);
        nodes['cloud-c'].setAttribute('transform', `translate(${f(wrap(180 - elapsed * 6,-180,1600))} 380) scale(.6)`);
        nodes['gull-a'].setAttribute('transform', `translate(${f(wrap(1100-elapsed*16,-100,1560))} ${f(204+Math.sin(elapsed)*3)}) rotate(-7)`);
        nodes['gull-b'].setAttribute('transform', `translate(${f(wrap(1151-elapsed*16,-100,1560))} ${f(229+Math.sin(elapsed+1)*3)}) scale(.7) rotate(-7)`);
        nodes.dunes.setAttribute('transform', `translate(${f(-(elapsed * 22 % 1440))} 0)`);
        nodes.road.setAttribute('transform', `translate(${f(-(elapsed * 150 % 1440))} 720)`);
        nodes['sea-ripples'].setAttribute('transform', `translate(${f(-30 * Math.sin(elapsed * .09))} 0)`);
        [...nodes['plants-back'].children].forEach((plant,i) => {
          const origin = i ? 1158 : 239;
          plant.setAttribute('x', f(wrap(origin-elapsed*50,-100,1600)));
        });
        [...nodes['plants-front'].children].forEach((plant,i) => {
          const origins = [144,165,1130,1107,1276];
          plant.setAttribute('x', f(wrap(origins[i]-elapsed*175,-100,1640)));
        });
      }

      function animate(time) {
        frameId = null;
        if (!playing || document.hidden) { lastTime = null; return; }
        if (lastTime !== null) elapsed += Math.min((time-lastTime)/1000,.05) * speed;
        lastTime = time;
        render();
        frameId = requestAnimationFrame(animate);
      }
      function schedule() {
        if (playing && !document.hidden && frameId === null) frameId = requestAnimationFrame(animate);
      }
      function updatePlayback() {
        $('play').setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
        $('play').setAttribute('aria-pressed', String(!playing));
        $('play-label').textContent = playing ? '歇一会' : '继续骑';
        $('pause-icon').toggleAttribute('hidden', !playing);
        $('play-icon').toggleAttribute('hidden', playing);
        $('status').textContent = playing ? '海风轻轻吹 · 快乐慢慢来' : '歇一会儿 · 风景一直都在';
        $('status-dot').style.background = playing ? '#789486' : '#c5a066';
        lastTime = null;
        if (!playing && frameId !== null) { cancelAnimationFrame(frameId); frameId = null; }
        schedule();
      }
      $('play').addEventListener('click', () => { playing = !playing; updatePlayback(); });
      $('speed').addEventListener('input', event => {
        speed = Number(event.target.value);
        $('speed-value').value = `${speed}×`;
        $('speed').setAttribute('aria-valuetext', `${speed} 倍速`);
      });
      document.addEventListener('visibilitychange', () => {
        lastTime = null;
        if (document.hidden && frameId !== null) { cancelAnimationFrame(frameId); frameId = null; }
        schedule();
      });
      reducedMotion.addEventListener('change', event => { if(event.matches) { playing = false; updatePlayback(); } });

      $('bell').addEventListener('click', () => {
        $('toast').textContent = '叮铃，叮铃 ♪';
        $('toast').classList.add('show');
        $('bell-lines').setAttribute('opacity','1');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { $('toast').classList.remove('show'); $('bell-lines').setAttribute('opacity','0'); },1300);
        try {
          const Audio = window.AudioContext || window.webkitAudioContext;
          if (!Audio) return;
          audioContext ||= new Audio();
          audioContext.resume().then(() => {
            const start = audioContext.currentTime;
            [0,.18].forEach(delay => {
              [1568,2352,3136].forEach((frequency, index) => {
                const oscillator = audioContext.createOscillator();
                const gain = audioContext.createGain();
                oscillator.type = 'sine'; oscillator.frequency.value = frequency;
                gain.gain.setValueAtTime(0,start+delay);
                gain.gain.linearRampToValueAtTime(.045/(index+1),start+delay+.004);
                gain.gain.exponentialRampToValueAtTime(.0001,start+delay+.65);
                oscillator.connect(gain); gain.connect(audioContext.destination);
                oscillator.start(start+delay); oscillator.stop(start+delay+.7);
                oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); };
              });
            });
          }).catch(() => {});
        } catch (_) { /* The visual bell remains available when audio is unsupported. */ }
      });
      const mobile = window.matchMedia('(max-width:560px)');
      function resizeScene() { $('scene').setAttribute('viewBox',mobile.matches ? '290 -80 780 920' : '0 0 1440 820'); }
      mobile.addEventListener('change',resizeScene);
      resizeScene(); render(); updatePlayback();
    })();
  </script>
</body>
</html>

id: direct_geometry
if:
  direct_parts_of: inputs.target
  in: nodes.direct_blocks.groups
then:
  run: templates/部件专项/generic/3.部件几何
  worker: generic_geometry:{target.id}
  outputs:
    svg: block-layers/character.svg
else:
  outputs:
    svg: nodes.direct_blocks.svg
inputs:
  target: inputs.target
  reference: inputs.reference
  groups: nodes.direct_blocks.groups
  svg: nodes.direct_blocks.svg
  preview_tool: inputs.preview_tool

id: part_base_colors
if:
  direct_parts_of: dispatch.item.path
  in: dispatch.inputs.groups
then:
  run: templates/部件专项/generic/4.rendering stack/4.1.基色与材质分区
  worker: "group:{group_path}"
  working_dir: '{working_dir}'
  inputs:
    group_path: dispatch.item.path
    reference: dispatch.inputs.reference
    groups: dispatch.inputs.groups
    guide_svg: carry.guide_svg
    artwork_svg: nodes.part_brush_lines.artwork_svg
    rendering:
      from: carry.rendering
      required: false
    preview_tool: dispatch.inputs.preview_tool
    rendering_tool:
      asset: tools/rendering.py
  outputs:
    artwork_svg: refinement/character.svg
    rendering: structure/rendering.json

id: group_layers
run: 3.大层分层稿
worker: group_layer_drawing
inputs:
  reference: nodes.base_subject.image
  groups: nodes.group_inventory.groups
  display_tool:
    asset: 2.皮套结构识别/tools/display_order.py
  face_tool:
    asset: 3.大层分层稿/tools/face_compare.py
  preview_tool:
    asset: tools/svg_preview.py
  compare_tool:
    asset: 3.大层分层稿/tools/compare.py
outputs:
  svg: block-layers/character.svg
  preview: block-layers/preview.png
  face_target: block-layers/checks/face-target.json
  face_report: block-layers/checks/face/report.json
review:
  run: 3.大层分层稿/review
  inputs:
    reference: nodes.base_subject.image
    groups: nodes.group_inventory.groups
    candidate: self.svg
    face_target: self.face_target
    face_report: self.face_report
    display_tool:
      asset: 2.皮套结构识别/tools/display_order.py
    face_tool:
      asset: 3.大层分层稿/tools/face_compare.py
    preview_tool:
      asset: tools/svg_preview.py
    compare_tool:
      asset: 3.大层分层稿/tools/compare.py
  outputs:
    report: reviews/group_layers/审查.md

id: refine_groups
working_dir: "{working_dir}"
inputs:
  reference: nodes.base_subject.image
  line_reference: nodes.line_reference.image
  groups: nodes.group_inventory.groups
  guide_svg: nodes.group_layers.guide_svg
  preview_tool:
    asset: tools/svg_preview.py
dispatch:
  # 总控依次 init → next → 执行当前 group 的路由 → complete → next，均使用同一 working_dir。
  # init 按本 YAML 绑定 --file、--state、树字段和路由名；后续命令沿用同一树与状态文件。
  # children 清单通过 expand --parent <item.id> --patch <清单> 写入树；空清单保留原树。
  # 步骤及其 review 通过后 checkpoint --pointer <节点id>；返修续做当前步骤，通过后再推进。
  # 当前 group 的全部步骤及 review 通过后 complete；carry 将最新成功产物传给下一组。
  document: dispatch.inputs.groups
  state: structure/groups.dispatch.json
  tool:
    asset: 4.专项细化/tools/group_cursor.py
  item: tool.next.target # 本轮选中的树节点；模板通过 inputs 接收需要的值
  order: breadth_first
  tree:
    root_key: groups
    child_edges:
      groups: group
      parts: part
    terminal_types: [part]
    dispatch_types: [group]
  routes:
    group: {}
  fallback: templates/部件专项/generic
  carry:
    guide_svg: dispatch.inputs.guide_svg
    artwork_svg: null # 首次尚无正式绘制，由模板交付后更新
    rendering: null
outputs:
  groups: dispatch.inputs.groups
  state: structure/groups.dispatch.json
  guide_svg: carry.guide_svg
  artwork_svg: carry.artwork_svg
  rendering: carry.rendering

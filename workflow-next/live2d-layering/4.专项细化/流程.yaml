id: refine_groups
working_dir: "{working_dir}"
inputs:
  reference: nodes.base_subject.image
  line_reference: nodes.line_reference.image
  groups: nodes.group_inventory.groups
  guide_svg: nodes.group_layers.guide_svg
  preview_tool:
    asset: tools/svg_preview.py
dispatch:
  # 总控用 init 初始化：--working-dir、--binding、--carry、树字段和路由名取本 YAML 的实际绑定值。
  # next 返回序列各自的 working_dir、inputs、carry 和 current；用这些路径交接当前 item 的路由。
  # expand、checkpoint、complete 均传 --worker <YAML选定身份> --worker-id <实际会话id>；expand、complete 另传 --node <制作节点id>。
  # children 通过 expand --parent <item.id> --patch <清单> 写入树副本；checkpoint --target <item.id> --pointer <节点id> --outputs <产物路径JSON> 保存步骤。
  # 路由交付后 complete --target <item.id>，序列内继续；全部 ready 后 aggregate，再 next。
  # aggregate 拒绝时返回 JSON：repairs 指定原 worker、group、文件和失效后项。先 repair --rejection <rejection_id> 恢复输入，再按 next 返回的 workers 和 repair 交接重跑。
  # 返修从该 group 路由开头执行，串行后项重跑，无关序列保留；blocked / tool_error 停止，交回输入或工具问题。退出码分别为 3 / 4 / 5。
  # 合并要求静态 SVG，样式直接写在元素上；defs、clipPath、mask、渐变和滤镜的本地引用由工具同步。冲突由原 worker 改稿后重新交付。
  # 所有命令的 --file 和 --state 始终绑定主工作目录的树与状态文件；完成状态由聚合发布。
  document: dispatch.inputs.groups
  state: structure/groups.dispatch.json
  tool:
    asset: 4.专项细化/tools/group_cursor.py
  sequences: tool.next.sequences
  order: breadth_first
  tree:
    root_key: groups
    child_edges:
      groups: group
      parts: part
    terminal_types: [part]
    dispatch_types: [group]
  routes:
    group: {}
  fallback: templates/部件专项/generic
  carry:
    guide_svg: dispatch.inputs.guide_svg
    artwork_svg: null # 首次尚无正式绘制，由模板交付后更新
    rendering: null
  parallel:
    for: dispatch.sequences
    as: dispatch.sequence
    serial:
      for: dispatch.sequence.items
      as: dispatch.item
      run: dispatch.route
  aggregate:
    tool:
      asset: 4.专项细化/tools/group_cursor.py
outputs:
  groups: dispatch.inputs.groups
  state: structure/groups.dispatch.json
  guide_svg: carry.guide_svg
  artwork_svg: carry.artwork_svg
  rendering: carry.rendering

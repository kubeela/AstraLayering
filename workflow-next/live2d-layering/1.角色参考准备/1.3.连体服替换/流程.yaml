id: base_subject
inputs:
  original: inputs.original
  reference: nodes.character_reference.image

if: options.wear_cloth == true
then:
  working_dir: "{working_dir}"
  run: 1.角色参考准备/1.3.连体服替换
  inputs:
    outfit:
      asset: 1.角色参考准备/1.3.连体服替换/可复用结果.jpg
  outputs:
    image: references/base-subject.png
  imagegen:
    prompt: 1.角色参考准备/1.3.连体服替换/生成提示词.txt
    inputs: [reference, outfit]
else:
  if: options.simplify == false
  then:
    outputs:
      image: inputs.original
  else:
    outputs:
      image: nodes.character_reference.image

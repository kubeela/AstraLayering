<svg xmlns="http://www.w3.org/2000/svg" width="300" height="220" viewBox="0 0 300 220">
<defs>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.5"/></filter>
  <clipPath id="hair_front_right_face_clip" clipPathUnits="userSpaceOnUse"><use href="#face_surface" clip-rule="nonzero"/></clipPath>
  <clipPath id="hair_front_right_ear_clip" clipPathUnits="userSpaceOnUse"><use href="#ear_surface" clip-rule="nonzero"/></clipPath>
  <path id="hair_front_right_cast_shape" d="M 102 19 C 62 8 33 34 32 89 Q 25 117 29 146 L 54 143 C 60 126 64 103 64 80 C 62 45 77 34 106 36 Z"/>
</defs>
<rect id="background" width="300" height="220" fill="#f2f4f6"/>
<g id="face_base" data-part="face_base" data-kind="face" transform="translate(55 15)">
  <path id="face_surface" d="M 100 20 C 164 20 168 103 142 148 Q 102 202 66 148 C 42 112 43 40 72 25 Q 86 19 100 20 Z" fill="#F8DDD2"/>
  <g id="hair_front_right_shadow_on_face" data-effect="cast-shadow" data-source-part="hair_front_right" data-target-part="face_base" data-target-id="face_surface" clip-path="url(#hair_front_right_face_clip)">

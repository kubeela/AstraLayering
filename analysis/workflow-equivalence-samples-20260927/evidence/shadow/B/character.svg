    <g filter="url(#soft)"><use href="#hair_front_right_cast_shape" fill="#CDA9AB"/></g>
  </g>
</g>
<g id="hair_front_right" data-part="hair_front_right" data-kind="hair" transform="translate(55 15)">
  <path id="hair_surface" d="M 95 16 C 53 5 31 38 31 89 Q 24 114 28 142 L 47 139 Q 56 107 56 78 Q 55 34 99 33 Z" fill="#8F9BB5"/>
</g>
</svg>

<text class="note" x="396" y="192">高光独立位移 / 旋转</text>
<text class="note" x="217" y="403">虹膜内圈控制瞳孔</text>
<text class="label" x="603" y="141">快级：眼眶与受限位移</text>
<text class="label" x="603" y="195">中级：虹膜形状 / 高光转动</text>
<text class="label" x="603" y="249">末级：瞳孔 / 高光 / 睫毛余颤</text>
<text class="note" x="603" y="324">内部先局部变形，再继承眼眶</text>
<text class="note" x="603" y="365">开口跟眼皮，不随虹膜漂移</text>
<text class="note" x="603" y="406">闭眼必须及时且完全遮住内部</text>
<text class="label" x="30" y="497">沿眼皮接触边保留线宽；眼角渐弱；虹膜、瞳孔、高光有各自控制。</text>
<text class="note" x="30" y="541">圆环与顶点是职责示意，不代表本轮程序网格或视频原网格的精确排布。</text>

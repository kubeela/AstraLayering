<metadata id="raster-depth-partition">{&quot;logicalPartId&quot;: &quot;halter_dress/short_outer_skirt/left_skirt_panel&quot;, &quot;step&quot;: &quot;clothing-raster-layering/step01&quot;, &quot;sourceSvgAtGenerationSha256&quot;: &quot;1357530e38b7f18645e7951946e76bf26b2df17fcb057f967f7487ed0c4d35e8&quot;, &quot;actualAlphaSha256&quot;: &quot;41671e00a63776699953bd2ed81dfbe652c1b73398a3fc06abd3795b6a85eb05&quot;, &quot;motionIdentity&quot;: &quot;halter_dress/short_outer_skirt/left_skirt_panel&quot;, &quot;ordinaryPaintLayers&quot;: [{&quot;name&quot;: &quot;0015 halter_dress/short_outer_skirt/left_skirt_panel :: depth_15&quot;, &quot;level&quot;: 15}, {&quot;name&quot;: &quot;0033 halter_dress/short_outer_skirt/left_skirt_panel :: depth_33&quot;, &quot;level&quot;: 33}, {&quot;name&quot;: &quot;0035 halter_dress/short_outer_skirt/left_skirt_panel :: depth_35&quot;, &quot;level&quot;: 35}], &quot;regions&quot;: [{&quot;level&quot;: 15, &quot;layer&quot;: &quot;0015 halter_dress/short_outer_skirt/left_skirt_panel :: depth_15&quot;, &quot;region&quot;: &quot;画面右髋侧后绕裙根，约x524–542/y493–557；沿连续髋侧转折接前面35，在衬边后绕13和长裙根之前、前衣身38之后。&quot;, &quot;span_file&quot;: &quot;parts/halter_dress/short_outer_skirt/left_skirt_panel/depth-15-spans.json&quot;}, {&quot;level&quot;: 33, &quot;layer&quot;: &quot;0033 halter_dress/short_outer_skirt/left_skirt_panel :: depth_33&quot;, &quot;region&quot;: &quot;下缘回卷内面与下垂唇边背向区，沿实际折返线接35后侧；在花簇31前、中央垂布36/37后，不吸收缺口花簇。；右外摆薄窄回折边，沿外侧实际卷缘接35的后面，保留同一裙片连续运动。&quot;, &quot;span_file&quot;: &quot;parts/halter_dress/short_outer_skirt/left_skirt_panel/depth-33-spans.json&quot;}, {&quot;level&quot;: 35, &quot;layer&quot;: &quot;0035 halter_dress/short_outer_skirt/left_skirt_panel :: depth_35&quot;, &quot;region&quot;: &quot;约 x472–774/y495–865 的前向展开裙面、固定蓝花珠饰与腰根前侧；在花簇和长垂裙之前，在 front_drape 相邻搭覆面及腰结带尾之后，侧向以髋侧转折接 level 15，自由边以实际翻折线接 level 33，不新增腰缝。&quot;, &quot;span_file&quot;: &quot;parts/halter_dress/short_outer_skirt/left_skirt_panel/depth-35-spans.json&quot;}], &quot;reason&quot;: &quot;固定坐标下可见轮廓与实际KRA同步；保留生成的被遮接合；共同运动多深度以互补绘画片表达&quot;, &quot;visibleHemCorrection&quot;: &quot;按真实自由边和卷回反面归属恢复本片可见参考材质；被遮补全保留生成与Krita画笔。&quot;, &quot;repair01&quot;: {&quot;issues&quot;: [&quot;R2&quot;, &quot;R4&quot;], &quot;currentPartPngSha256&quot;: &quot;2ae949fe9d7cdb6ae818814d3767de55901203a90a7c8e5103886786252a781f&quot;, &quot;report&quot;: &quot;../clothing-raster-layering/step01/repair-01.md.tmp&quot;, &quot;paintingStatus&quot;: &quot;self_checked_this_repair&quot;, &quot;note&quot;: &quot;按review-01原坐标修复并在当前KRA重开核对；R2各片腰根连续，R4隐藏窄折面已收顺；保留共同控制身份及普通深度分片；领瓣/裙卷面/花簇/短布青点翻面不迁入相邻部件。&quot;}}</metadata>

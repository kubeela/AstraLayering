<metadata id="raster-depth-partition">{&quot;logicalPartId&quot;: &quot;halter_dress/short_outer_skirt/right_skirt_panel&quot;, &quot;step&quot;: &quot;clothing-raster-layering/step01&quot;, &quot;sourceSvgAtGenerationSha256&quot;: &quot;2fec110b166719f0f36ca7ac5add9f5d204b158b2e7c4d1d48509025a94cb17b&quot;, &quot;actualAlphaSha256&quot;: &quot;ce4107105d3eaf06d588c32f779e3a1459ce307dc15a624186b517c66690f092&quot;, &quot;motionIdentity&quot;: &quot;halter_dress/short_outer_skirt/right_skirt_panel&quot;, &quot;ordinaryPaintLayers&quot;: [{&quot;name&quot;: &quot;0014 halter_dress/short_outer_skirt/right_skirt_panel :: depth_14&quot;, &quot;level&quot;: 14}, {&quot;name&quot;: &quot;0032 halter_dress/short_outer_skirt/right_skirt_panel :: depth_32&quot;, &quot;level&quot;: 32}, {&quot;name&quot;: &quot;0034 halter_dress/short_outer_skirt/right_skirt_panel :: depth_34&quot;, &quot;level&quot;: 34}], &quot;regions&quot;: [{&quot;level&quot;: 14, &quot;layer&quot;: &quot;0014 halter_dress/short_outer_skirt/right_skirt_panel :: depth_14&quot;, &quot;region&quot;: &quot;画面左腰侧后绕裙根窄区，约x381–405/y494–557；沿髋侧回转接前面34，后于前衣身38和腰结，前于同侧长裙及衬边后绕13。&quot;, &quot;span_file&quot;: &quot;parts/halter_dress/short_outer_skirt/right_skirt_panel/depth-14-spans.json&quot;}, {&quot;level&quot;: 32, &quot;layer&quot;: &quot;0032 halter_dress/short_outer_skirt/right_skirt_panel :: depth_32&quot;, &quot;region&quot;: &quot;左侧自由下缘小翻边反面，沿真实卷回线接34后侧；仍在蓝花衬边31前。；中央左缺口左侧连续回折衣料；本步纠正原来落入花簇衬边的上段蓝紫反面，沿真实折返接34，不封花簇缺口。&quot;, &quot;span_file&quot;: &quot;parts/halter_dress/short_outer_skirt/right_skirt_panel/depth-32-spans.json&quot;}, {&quot;level&quot;: 34, &quot;layer&quot;: &quot;0034 halter_dress/short_outer_skirt/right_skirt_panel :: depth_34&quot;, &quot;region&quot;: &quot;画面左侧 x158–422/y496–838 的前向主展开裙面及蓝花、珠饰、腰根前段；从 level 14 髋侧转折连续向前展开，沿真实折返线接 level 32。主面在花簇及长垂裙之前，在中央 front_drape 搭覆区域及腰结带尾之后；上部控制交接不画衣缝。&quot;, &quot;span_file&quot;: &quot;parts/halter_dress/short_outer_skirt/right_skirt_panel/depth-34-spans.json&quot;}], &quot;reason&quot;: &quot;固定坐标下可见轮廓与实际KRA同步；保留生成的被遮接合；共同运动多深度以互补绘画片表达&quot;, &quot;visibleHemCorrection&quot;: &quot;按真实自由边和卷回反面归属恢复本片可见参考材质；被遮补全保留生成与Krita画笔。&quot;, &quot;repair01&quot;: {&quot;issues&quot;: [&quot;R2&quot;, &quot;R3&quot;], &quot;currentPartPngSha256&quot;: &quot;31e2981d87c3448287147dfb2cd696f758c498cefb0516bd1882c59d278bcf27&quot;, &quot;report&quot;: &quot;../clothing-raster-layering/step01/repair-01.md.tmp&quot;, &quot;paintingStatus&quot;: &quot;self_checked_this_repair&quot;, &quot;note&quot;: &quot;按review-01原坐标修复并在当前KRA重开核对；R2各片腰根连续，R4隐藏窄折面已收顺；保留共同控制身份及普通深度分片；领瓣/裙卷面/花簇/短布青点翻面不迁入相邻部件。&quot;}}</metadata>

<metadata id="raster-depth-partition">{&quot;logicalPartId&quot;: &quot;halter_dress/short_outer_skirt/front_drape&quot;, &quot;step&quot;: &quot;clothing-raster-layering/step01&quot;, &quot;sourceSvgAtGenerationSha256&quot;: &quot;9c806342681942ac110ebe35a6adb716e2409e87b505ac199dc1a66ea101992d&quot;, &quot;actualAlphaSha256&quot;: &quot;003efda5b334aa0346d33baed4a86d4e643e098caf49a836279dd56550ef7e92&quot;, &quot;motionIdentity&quot;: &quot;halter_dress/short_outer_skirt/front_drape&quot;, &quot;ordinaryPaintLayers&quot;: [{&quot;name&quot;: &quot;0036 halter_dress/short_outer_skirt/front_drape :: depth_36&quot;, &quot;level&quot;: 36}, {&quot;name&quot;: &quot;0037 halter_dress/short_outer_skirt/front_drape :: depth_37&quot;, &quot;level&quot;: 37}], &quot;regions&quot;: [{&quot;level&quot;: 36, &quot;layer&quot;: &quot;0036 halter_dress/short_outer_skirt/front_drape :: depth_36&quot;, &quot;region&quot;: &quot;画面左缺口右侧自卷反面，沿真实折返与主面37连续，盖住邻接侧裙和花簇，保留缺口。；画面右自由端蓝紫反面和折返唇边，沿上端(550,739)向下连续转入37后侧；仍在两侧裙面和衬边之前。&quot;, &quot;span_file&quot;: &quot;parts/halter_dress/short_outer_skirt/front_drape/depth-36-spans.json&quot;}, {&quot;level&quot;: 37, &quot;layer&quot;: &quot;0037 halter_dress/short_outer_skirt/front_drape :: depth_37&quot;, &quot;region&quot;: &quot;中央腰根 x416–480/y500–540 向 x380–578/y735–858 展开的全部前向主垂面、波浪底缘及右下自由搭覆端；盖住两侧裙布相邻搭覆区域及花簇、长垂裙根，在腰结和两带尾之后，至真实自由边折返线接 level 36；上部连续交接不新增衣缝。&quot;, &quot;span_file&quot;: &quot;parts/halter_dress/short_outer_skirt/front_drape/depth-37-spans.json&quot;}], &quot;reason&quot;: &quot;固定坐标下可见轮廓与实际KRA同步；保留生成的被遮接合；共同运动多深度以互补绘画片表达&quot;, &quot;visibleHemCorrection&quot;: &quot;按真实自由边和卷回反面归属恢复本片可见参考材质；被遮补全保留生成与Krita画笔。&quot;, &quot;repair01&quot;: {&quot;issues&quot;: [&quot;R2&quot;, &quot;R3&quot;, &quot;R4&quot;], &quot;currentPartPngSha256&quot;: &quot;699354bc135b7c16b982ce997be38ec5acb5d9776b82fe7d020b7a344a021c4f&quot;, &quot;report&quot;: &quot;../clothing-raster-layering/step01/repair-01.md.tmp&quot;, &quot;paintingStatus&quot;: &quot;self_checked_this_repair&quot;, &quot;note&quot;: &quot;按review-01原坐标修复并在当前KRA重开核对；R2各片腰根连续，R4隐藏窄折面已收顺；保留共同控制身份及普通深度分片；领瓣/裙卷面/花簇/短布青点翻面不迁入相邻部件。&quot;}}</metadata>

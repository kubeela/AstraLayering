<metadata id="raster-depth-partition">{&quot;logicalPartId&quot;: &quot;floral_skirt_undertrim&quot;, &quot;step&quot;: &quot;clothing-raster-layering/step01&quot;, &quot;sourceSvgAtGenerationSha256&quot;: &quot;d47cdce278b896abdfa145ba0513fa3672fda73619e3d1d2dfdce226f1c41b7f&quot;, &quot;actualAlphaSha256&quot;: &quot;d9eab31b0e83c620ef1574d58b2eafae7172df9b1a1b3eb9b4967abba0651d2d&quot;, &quot;motionIdentity&quot;: &quot;floral_skirt_undertrim&quot;, &quot;ordinaryPaintLayers&quot;: [{&quot;name&quot;: &quot;0013 floral_skirt_undertrim :: depth_13&quot;, &quot;level&quot;: 13}, {&quot;name&quot;: &quot;0031 floral_skirt_undertrim :: depth_31&quot;, &quot;level&quot;: 31}], &quot;regions&quot;: [{&quot;level&quot;: 13, &quot;layer&quot;: &quot;0013 floral_skirt_undertrim :: depth_13&quot;, &quot;region&quot;: &quot;画面左外端侧后回绕窄幅及隐藏接合，沿侧向回转带接前花串31；在长垂裙根前、裙侧后根14之后。；画面右外端侧后回绕窄幅及隐藏接合，沿实际侧向转折接前花串31；在长尾根前、右侧裙后根15之后。&quot;, &quot;span_file&quot;: &quot;parts/floral_skirt_undertrim/depth-13-spans.json&quot;}, {&quot;level&quot;: 31, &quot;layer&quot;: &quot;0031 floral_skirt_undertrim :: depth_31&quot;, &quot;region&quot;: &quot;前侧连续蓝紫/青蓝花簇、叶瓣和穗边，约 x154–783/y744–902 中面向前方的下缘串及两个内凹缺口内露出的小簇；在长垂裙及 level 13 后绕区之前、三片短外裙含其翻边之后。以两端侧向回转带衔接后绕区，上界沿真实裙缘和缺口，不封中央腿侧空域。&quot;, &quot;span_file&quot;: &quot;parts/floral_skirt_undertrim/depth-31-spans.json&quot;}], &quot;reason&quot;: &quot;固定坐标下可见轮廓与实际KRA同步；保留生成的被遮接合；共同运动多深度以互补绘画片表达&quot;, &quot;visibleHemCorrection&quot;: &quot;按真实自由边和卷回反面归属恢复本片可见参考材质；被遮补全保留生成与Krita画笔。&quot;, &quot;repair01&quot;: {&quot;issues&quot;: [&quot;R5&quot;, &quot;R6&quot;], &quot;currentPartPngSha256&quot;: &quot;06fa6b991e4e65f5fcb64851d11547550ba41a1ef85c33d0209fd55c3842175b&quot;, &quot;report&quot;: &quot;../clothing-raster-layering/step01/repair-01.md.tmp&quot;, &quot;paintingStatus&quot;: &quot;self_checked_this_repair&quot;, &quot;note&quot;: &quot;按review-01原坐标修复并在当前KRA重开核对；R2各片腰根连续，R4隐藏窄折面已收顺；保留共同控制身份及普通深度分片；领瓣/裙卷面/花簇/短布青点翻面不迁入相邻部件。&quot;}, &quot;repair02&quot;: {&quot;issues&quot;: [&quot;R1&quot;, &quot;R2-contact&quot;], &quot;currentPartPngSha256&quot;: &quot;4f56db4482de09a376a9adfba2c8f8f17719d8bdbdafdf5aea247f67f6e833fe&quot;, &quot;report&quot;: &quot;../clothing-raster-layering/step01/repair-02.md.tmp&quot;, &quot;paintingStatus&quot;: &quot;self_checked_this_repair&quot;, &quot;note&quot;: &quot;按review-02原坐标局部修复。花瓣/浅色翻面/深色星点布归属保持；收回8的右上外扩，10自有窄根接续，6长尾不改绘画。&quot;}}</metadata>

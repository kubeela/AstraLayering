_image_left/depth-5-spans.json&quot;}, {&quot;level&quot;: 7, &quot;layer&quot;: &quot;0007 trailing_skirt_image_left :: depth_07&quot;, &quot;region&quot;: &quot;上段深色星点面及固定缘饰，在浅色长尾5前、回翻小舌9和紫红舌11后；根部在花簇和外裙之后。；金缘与其连续窄接面随上段深色布，按实际金缘外弧补入7，避免将固定金缘割成5中的零碎孤片。&quot;, &quot;span_file&quot;: &quot;parts/trailing_skirt_image_left/depth-7-spans.json&quot;}, {&quot;level&quot;: 9, &quot;layer&quot;: &quot;0009 trailing_skirt_image_left :: depth_09&quot;, &quot;region&quot;: &quot;上段浅色回翻舌，沿深色自由弧连续翻到7前、在紫红回压舌11后，不移交其他衣片。&quot;, &quot;span_file&quot;: &quot;parts/trailing_skirt_image_left/depth-9-spans.json&quot;}, {&quot;level&quot;: 11, &quot;layer&quot;: &quot;0011 trailing_skirt_image_left :: depth_11&quot;, &quot;region&quot;: &quot;紫红回压卷舌与前压唇边，沿浅色小舌9下缘连续回转；全部仍属于左侧长垂裙。&quot;, &quot;span_file&quot;: &quot;parts/trailing_skirt_image_left/depth-11-spans.json&quot;}], &quot;reason&quot;: &quot;固定坐标下可见轮廓与实际KRA同步；保留生成的被遮接合；共同运动多深度以互补绘画片表达&quot;, &quot;visibleHemCorrection&quot;: &quot;按真实自由边和卷回反面归属恢复本片可见参考材质；被遮补全保留生成与Krita画笔。&quot;, &quot;repair01&quot;: {&quot;issues&quot;: [&quot;R7&quot;], &quot;currentPartPngSha256&quot;: &quot;6ee5212f8bf0dfa09bed771802b3a50110922cafa9c6811c12c3cb7a5de315c4&quot;, &quot;report&quot;: &quot;../clothing-raster-layering/step01/repair-01.md.tmp&quot;, &quot;paintingStatus&quot;: &quot;self_checked_this_repair&quot;, &quot;note&quot;: &quot;按review-01原坐标修复并在当前KRA重开核对；R2各片腰根连续，R4隐藏窄折面已收顺；保留共同控制身份及普通深度分片；领瓣/裙卷面/花簇/短布青点翻面不迁入相邻部件。&quot;}, &quot;repair02&quot;: {&quot;issues&quot;: [&quot;R1&quot;], &quot;currentPartPngSha256&quot;: &quot;d930a251528b1c4f3aedd86637759178c77e393d6b943a195c37ecf4139cb0ca&quot;, &quot;report&quot;: &quot;../clothing-raster-layering/step01/repair-02.md.tmp&quot;, &quot;paintingStatus&quot;: &quot;self_checked_this_repair&quot;, &quot;note&quot;: &quot;按review-02原坐标局部修复。花瓣/浅色翻面/深色星点布归属保持；收回8的右上外扩，10自有窄根接续，6长尾不改绘画。&quot;}}</metadata>

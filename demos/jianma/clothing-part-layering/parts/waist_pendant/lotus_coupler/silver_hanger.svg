  <g id="waist_pendant_lotus_coupler_silver_hanger_outline" data-group-path="waist_pendant/lotus_coupler/silver_hanger" fill="#E25F87" stroke="none">
    <desc>上方银色人字吊架及顶茎。顶茎在 lower_silver_strand 水滴底接点之后保留父范围内搭接；左右臂端位于两侧短支挂根之前，下方与 central_diamond_pendant 之间保留真实空隙，不含短支、中央悬饰、水滴、莲体或上环。整片位于中央蓝幅、内裙及腹下／腿之前，随 lower_silver_strand 上根共同运动，可作为统一刚体旋转并驱动短支及中央悬饰挂根；固定深度为水滴之后、短支挂根之前。</desc>

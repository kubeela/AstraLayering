<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536" data-source-sha256="5cd6ab6bae4916447e110954fe965d11b9240b88510047dcef995cefbcdb1305">
  <g id="waist_pendant_upper_suspension_right_suspension_cord" data-group-path="waist_pendant/upper_suspension/right_suspension_cord" fill="#E96B95" stroke="none">
    <desc>角色右侧、画面左侧的整支细悬绳：上端约 x503、y504～512 为藏于腰结／束带前缘之后的短入结端；连续弧绳自约 x500、y511 沿左弧下行，回收至 x511、y592，位于腹前身体、中央蓝幅及内裙之前，下端保留藏于 junction_linkage 汇接小结之后的短搭接。不含另一支绳、汇接结翼、珠接或腰带短布穗。上挂点随腰结及骨盆，下端与 left_suspension_cord 共同跟随汇接点，整支随腰前悬饰运动并按上下端柔性弯曲；终止为单一 part，无需前后片拆分。</desc>

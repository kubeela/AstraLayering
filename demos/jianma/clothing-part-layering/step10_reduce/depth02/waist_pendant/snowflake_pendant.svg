<desc>中央整枚镂空银饰及固定银蓝内饰、顶接舌、底连接尖。镂空保留透明；整体位于中央蓝幅、内裙和腹前身体之前。顶端随上部悬挂摆动，整枚保持形状，底接传动下段银串；两端接续在雪花主体后搭接。</desc>

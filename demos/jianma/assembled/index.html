const $=id=>document.getElementById(id),canvas=$('view'),ctx=canvas.getContext('2d');
const composite=document.createElement('canvas');composite.width=1024;composite.height=1536;const cc=composite.getContext('2d');
const labels={body:'躯干',legs:'腿与足饰',arms:'手臂与手',hair:'头发',face:'面部',head_accessories:'头饰',neck:'颈部',pelvis:'骨盆',outer_robe:'外袍与纱袖',inner_dress:'内裙',waist_sash:'腰带',collar_fastener:'领扣与胸链',chest_ornament:'胸饰',waist_pendant:'腰间挂饰'};

for(const layer of DATA.layers){layer.visible=true;const part=layer.name.replace(/^\d+ /,'').split('/')[0],key=layer.source+'/'+part;if(!groups.has(key))groups.set(key,{source:layer.source,part,layers:[]});groups.get(key).layers.push(layer)}
for(const [key,group] of groups){let detail=document.createElement('details'),summary=document.createElement('summary'),check=document.createElement('input');check.type='checkbox';check.checked=true;check.setAttribute('aria-label','显示 '+(labels[group.part]||group.part));check.onclick=e=>e.stopPropagation();check.onchange=()=>{solo=null;group.layers.forEach(l=>l.visible=check.checked);sync();draw()};summary.append(check,document.createTextNode((group.source==='clothing'?'衣装 · ':'人物 · ')+(labels[group.part]||group.part)));let count=document.createElement('small');count.textContent=group.layers.length;summary.append(count);detail.append(summary);group.check=check;group.detail=detail;
 for(const layer of [...group.layers].reverse()){let row=document.createElement('div');row.className='row';let input=document.createElement('input');input.type='checkbox';input.checked=true;input.id='layer-'+layer.id;input.onchange=()=>{solo=null;layer.visible=input.checked;sync();draw()};let label=document.createElement('label');label.htmlFor=input.id;label.textContent=layer.name.replace(/^\d+ /,'').split('/').slice(1).join('/')||layer.name;label.title=layer.name;let button=document.createElement('button');button.textContent='独显';button.setAttribute('aria-label','独显 '+layer.name);button.onclick=()=>{solo=solo===layer.id?null:layer.id;if(solo)$('mode').value='result';draw()};row.append(input,label,button);detail.append(row);layer.checkbox=input;layer.row=row}

function sync(){for(const layer of DATA.layers)layer.checkbox.checked=layer.visible;for(const group of groups.values()){group.check.checked=group.layers.every(l=>l.visible);group.check.indeterminate=!group.check.checked&&group.layers.some(l=>l.visible)}}
function draw(){if(!ready)return;cc.clearRect(0,0,1024,1536);const clothesOn=DATA.layers.some(l=>l.source==='clothing'&&l.visible),useMasks=$('masks').checked;for(const layer of DATA.layers){if(solo?layer.id!==solo:!layer.visible)continue;const masked=useMasks&&layer.hasMask&&(layer.source==='clothing'||clothesOn),variant=masked?layer.masked:layer.original;if(variant)cc.drawImage(variant.image,variant.x,variant.y)}
 const mode=$('mode').value,w=mode==='side'?2048:1024;canvas.width=w;canvas.height=1536;let bg=$('background').value;if(bg==='checker'){ctx.fillStyle='#e8e8ed';ctx.fillRect(0,0,w,1536);ctx.fillStyle='#d5d7df';for(let y=0;y<1536;y+=24)for(let x=0;x<w;x+=24)if((x/24+y/24)%2)ctx.fillRect(x,y,24,24)}else{ctx.fillStyle=bg;ctx.fillRect(0,0,w,1536)}
 if(mode==='side'){ctx.drawImage(ref,0,0);ctx.drawImage(composite,1024,0)}else if(mode==='reference')ctx.drawImage(ref,0,0);else if(mode==='result')ctx.drawImage(composite,0,0);else{ctx.drawImage(composite,0,0);let split=+$('wipe').value/100*1024;ctx.save();ctx.beginPath();ctx.rect(0,0,split,1536);ctx.clip();ctx.drawImage(ref,0,0);ctx.restore();ctx.fillStyle='#497aab';ctx.fillRect(split-1,0,2,1536)}
 $('wipeControl').style.display=mode==='wipe'?'flex':'none';$('status').textContent=solo?'独显部件':DATA.layers.filter(l=>l.visible).length+' / 159 层';$('hint').textContent=solo?'正在独显当前部件；再次点击“独显”或“恢复全部”退出。':mode==='side'?'左：simplified-character 参考　·　右：当前图层合成。':mode==='wipe'?'分界左侧是参考，右侧是当前合成。拖动分界滑杆查看差异。':mode==='reference'?'simplified-character 原始参考。':'当前可见图层的实时合成。'}

$('search').oninput=()=>{const q=$('search').value.toLowerCase().trim();for(const group of groups.values()){let found=false;for(const layer of group.layers){const hit=!q||(layer.name+' '+(labels[group.part]||'')).toLowerCase().includes(q);layer.row.dataset.hidden=!hit;found||=hit}group.detail.style.display=found?'':'none';if(q&&found)group.detail.open=true}};
async function start(){ref=await load('reference.png');await Promise.all(DATA.layers.map(async l=>{for(const v of [l.original,l.masked])if(v)v.image=await load(v.file)}));ready=true;draw()}

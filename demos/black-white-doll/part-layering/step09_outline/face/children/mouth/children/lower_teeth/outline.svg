  <desc>参考当前口部开口仅上缘可见浅色上牙带，下缘为粉色口腔及舌面与下唇边界，没有可辨认的下牙露出。lower_teeth 完全藏在 lower_lip 后，本轮保留空轮廓节点；完整下牙弓及隐藏余量留给后续补全。</desc>

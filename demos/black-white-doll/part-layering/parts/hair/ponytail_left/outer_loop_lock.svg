<desc>角色自身左马尾的连续外绕发束，保留长开口、细开口、内卷尖和主面遮挡下的局部搭接。已补齐本轮上部长弧、细外弧、最外回环右缘及下方回收外缘的父内窄条。父范围仍限制：x696–700、y135–149 及 x726–734、y242–255 的上部长弧外侧；x758–771、y310–350 的长开口右缘，以及 x766–795、y305–373 的外张弧外侧；x794–802、y402–418 的交接窄楔；x807–811、y550–553 的回环下外缘。以上父外残余未恢复，需上游调整父实体或孔洞。头饰后扎点的父外隐藏区域仍交后续补全。</desc>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Astra · Expression Preview</title>
<style>
:root{font:13px/1.55 "Segoe UI","Microsoft YaHei",sans-serif;color:#e6ebee;background:#171b21;--line:#333d48;--muted:#95a4b3;--accent:#9ee0d6}*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;padding:7px 11px;background:#252d37}button:hover{border-color:#7b9b9c;background:#303e47}button:disabled{opacity:.4;cursor:default}button.primary{background:var(--accent);color:#133835;border-color:var(--accent);font-weight:600}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}input,select,textarea{border:1px solid var(--line);background:#161e26;border-radius:5px;padding:5px;min-width:0}input[type=range]{width:100%;padding:0;accent-color:var(--accent);cursor:pointer}input[type=number]{width:75px;font-variant-numeric:tabular-nums}input[type=checkbox]{accent-color:var(--accent)}[hidden]{display:none!important}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);background:#1c232c}.brand{font-size:15px;font-weight:650;letter-spacing:.5px}.brand span{color:var(--accent)}.sub{font-size:11px;color:var(--muted);font-weight:400;letter-spacing:0;margin-top:3px}.actions{display:flex;gap:7px;flex-wrap:wrap}main{display:grid;grid-template-columns:minmax(0,1fr) 356px;min-height:0}#viewer{width:100%;height:100%;border:0;min-height:360px}aside{overflow:auto;border-left:1px solid var(--line);padding:18px;background:#1b222b}section{margin-bottom:24px}h2{font-size:13px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}h2 small{color:var(--muted);font-size:11px;font-weight:400}.files{border-bottom:1px solid var(--line);padding-bottom:16px}.file{font-size:11px;display:flex;gap:9px;color:var(--muted);margin-top:8px;overflow-wrap:anywhere}.file b{color:#dce8ec;white-space:nowrap;font-weight:500}.empty{border:1px dashed #445260;border-radius:9px;padding:18px 14px;color:var(--muted);font-size:12px;line-height:1.9}.empty strong{color:#dce8ec;font-weight:500}.row{display:grid;grid-template-columns:1fr 70px;align-items:center;gap:10px;margin-top:5px}.control{padding:10px 0;border-bottom:1px solid #ffffff08}.control-label{display:flex;justify-content:space-between;align-items:center;font-size:12px;gap:5px}.control-label code{font-size:10px;color:var(--muted)}.control select{width:100%;margin-top:6px}.control small{font-size:10px;color:#7fbdae}.recipe{padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#202933}.recipe label{display:flex;align-items:center;gap:8px;cursor:pointer}.recipe p{font-size:11px;color:var(--muted);margin:4px 0 8px}.recipe .row{grid-template-columns:1fr 38px}.recipe output{font-size:11px;font-variant-numeric:tabular-nums;color:var(--accent)}.anim{padding:12px 0;border-bottom:1px solid var(--line)}.anim-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.anim-head span{font-size:12px}.anim p{font-size:11px;color:var(--muted);margin:5px 0}.anim-controls{display:flex;gap:5px;align-items:center;flex-wrap:wrap;font-size:11px}.anim-controls button{padding:4px 8px}.anim-controls select{padding:3px}.time{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}.instance{padding:10px;margin-top:7px;background:#151e27;border-radius:6px}.instance .anim-head{font-size:11px;overflow-wrap:anywhere}.quiet{border:0;padding:3px 5px;color:var(--muted);font-size:11px;background:transparent}details{margin:15px 0;border-top:1px solid var(--line);padding-top:12px}summary{cursor:pointer;color:#aebec9;font-size:12px}textarea{width:100%;height:180px;font:11px/1.6 Consolas,monospace;resize:vertical;margin:10px 0;tab-size:2}footer{padding:8px 20px;background:#1c232c;border-top:1px solid var(--line);font-size:11px;display:flex;justify-content:space-between;gap:16px;color:var(--muted)}#status{overflow-wrap:anywhere}#status.error{color:#ffb9a9}.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:7px}.search{width:100%;margin-bottom:7px;font-size:11px}.hint{color:var(--muted);font-size:11px}.badge{font-size:10px;background:#9ee0d615;color:var(--accent);padding:3px 7px;border-radius:12px;white-space:nowrap}.mobile-hint{display:none}@media(max-width:900px){main{grid-template-columns:minmax(0,1fr) 300px}header{padding:12px}.brand{font-size:13px}.sub{max-width:240px}aside{padding:14px}}@media(max-width:650px){body{height:auto;min-height:100vh}header{align-items:flex-start;flex-direction:column}main{display:flex;flex-direction:column}#viewer{height:52vh;min-height:320px}aside{border-left:0;border-top:1px solid var(--line);overflow:visible}.actions button{font-size:11px}footer{position:sticky;bottom:0}.offline{display:none}}
</style>
</head>
<body>
<header>
 <div class="brand"><span>ASTRA</span> / Expression Preview<div class="sub">加载已制作的表情 · 组合参数与动画</div></div>
 <div class="actions"><button id="loadSvg" class="primary">角色 SVG</button><button id="loadJson">控制 JSON</button><button id="demo">体验样例</button><button id="pauseAll" disabled>暂停时间</button><button id="resetAll" disabled>恢复默认</button></div>
 <input id="svgFile" type="file" accept=".svg,image/svg+xml" hidden><input id="jsonFile" type="file" accept=".json,application/json" hidden>
</header>
<main>
 <iframe id="viewer" src="svg-preview.html?expression=1" title="SVG 角色与参考图预览"></iframe>
 <aside>
  <section class="files"><h2>当前角色 <span id="character" class="badge">等待载入</span></h2><div class="file"><b>SVG</b><span id="svgName">未选择</span></div><div class="file"><b>JSON</b><span id="jsonName">未选择</span></div></section>
  <div id="empty" class="empty"><strong>打开角色，再选择对应的控制 JSON</strong><br>也可以将两个文件一起拖入窗口；所有文件在本地处理。<br><br>使用「体验样例」可查看眼部形变、嘴型、流泪与叹号的协议演示。</div>
  <div id="controls" hidden>
   <section><h2>表情组合 <small>可同时启用兼容项</small></h2><div id="expressions"></div></section>
   <section><h2>参数调整 <button id="clearManual" class="quiet">清除手动覆盖</button></h2><input id="search" class="search" placeholder="查找参数名称或编号" aria-label="查找参数"><div id="parameters"></div></section>
   <section><h2>动画 <small>播放、调速与定位</small></h2><div id="animations"></div><div id="instances"></div></section>
   <details><summary>程序控制与导出</summary><p class="hint">指令使用同一套公开参数；发生错误时保留上一状态。</p><textarea id="command" aria-label="JSON 控制指令" spellcheck="false"></textarea><div class="actions"><button id="runCommand">执行指令</button><button id="exportCommand">导出当前控制</button><button id="exportCatalog">导出能力目录</button><button id="exportSvg">导出当前帧 SVG</button></div><p class="hint">当前控制导出为可重放指令，动画从头开始；SVG 导出为当前静态帧。</p></details>
  </div>
 </aside>
</main>
<footer><span id="status" role="status" aria-live="polite">选择 SVG 与控制 JSON，或打开样例。</span><span class="offline"><i class="live-dot"></i>离线 · 文件不上传</span></footer>
<script src="expression-demo.js"></script>
<script src="expression-preview.js"></script>
</body>
</html>

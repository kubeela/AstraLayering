<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Astra · 分组树查看器</title>
<style>
:root{font-family:Inter,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;color:#e7eeef;background:#101719;--panel:#172124;--panel-light:#1d292d;--line:#314044;--muted:#91a5a9;--accent:#91e5d6;--warn:#ffba96}
*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,.node-main:focus-visible{outline:2px solid var(--accent);outline-offset:2px}[hidden]{display:none!important}
.app{min-height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr)}
header{display:flex;align-items:center;gap:16px;padding:17px clamp(20px,4vw,48px);border-bottom:1px solid var(--line);background:#141d20}
.mark{display:grid;place-items:center;width:37px;height:37px;border-radius:10px;background:#27514d;color:var(--accent);font-size:24px;line-height:1}
.brand{min-width:0;flex:1}.brand strong{display:block;font-size:15px;letter-spacing:.08em}.brand span{display:block;margin-top:3px;font-size:11px;color:var(--muted)}
.actions{display:flex;align-items:center;gap:8px}.button{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 13px;border:1px solid var(--line);border-radius:8px;background:#1c292c;color:#dbe8e9;font-size:12px;white-space:nowrap}.button:hover{background:#26383a}.button.primary{background:#8fe1d2;border-color:#8fe1d2;color:#12312d;font-weight:700}.button.primary:hover{background:#a5efdf}.button:disabled{cursor:default;opacity:.4}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 295px;min-height:0;height:calc(100vh - 72px)}
main{min-width:0;min-height:0;display:flex;flex-direction:column;padding:28px clamp(20px,4vw,48px) 32px}
.intro{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px}.intro-copy{min-width:0;flex:1}.eyebrow{font-size:10px;color:var(--accent);letter-spacing:.17em;font-weight:700;text-transform:uppercase}.intro h1{font-size:26px;line-height:1.25;font-weight:620;margin:7px 0 7px}.intro p{font-size:12px;color:var(--muted);line-height:1.7;margin:0}.filename{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60vw}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}.search{flex:1 1 190px;min-width:0;max-width:340px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#131d20;color:#e7eeef;font-size:12px}.search::placeholder{color:#82979b}.stats{margin-left:auto;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.tree-panel{flex:1;min-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:linear-gradient(145deg,#1b282b,#162124 65%);scrollbar-color:#456063 transparent}
.tree-content{padding:25px 26px 45px;min-width:max-content}.tree-root,.tree-root ul{list-style:none;margin:0;padding:0}.tree-root ul{margin-left:16px;padding-left:20px;border-left:1px solid #476363}.tree-root li{position:relative;margin:7px 0}.tree-root ul>li::before{content:"";position:absolute;top:21px;left:-20px;width:20px;border-top:1px solid #476363}.tree-root ul>li:last-child::after{content:"";position:absolute;left:-21px;top:22px;bottom:-9px;width:2px;background:#1a272a}
.node-row{display:flex;align-items:center;gap:6px;width:max-content;max-width:100%}.toggle{display:grid;place-items:center;flex:none;width:25px;height:29px;border:0;border-radius:6px;background:transparent;color:#96b9b8;font-size:14px;line-height:1}.toggle:hover{background:#294043}.toggle:disabled{opacity:.45;cursor:default}.toggle-spacer{width:25px;flex:none}.node-main{display:flex;align-items:center;gap:9px;min-height:37px;max-width:550px;padding:7px 11px;border:1px solid #456061;border-radius:8px;background:#26393b;color:#eaf4f3;text-align:left;box-shadow:0 3px 12px #08111322}.node-main:hover{background:#30494a;border-color:#77b9b0}.node-main.selected{border-color:var(--accent);background:#33504d;box-shadow:0 0 0 2px #91e5d622}.node-main.leaf{background:#202f32;border-color:#3c5255}.node-main.leaf.selected{border-color:var(--accent);background:#33504d}.node-name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.node-count,.note-mark{font-size:10px;color:#a2cdcb;white-space:nowrap}.node-count{border-left:1px solid #60807b;padding-left:9px}.match .node-name{color:#b7ffdf}.empty{display:grid;place-items:center;height:100%;min-height:260px;text-align:center;padding:38px 20px}.empty-icon{font-size:42px;color:#7dc6b9;margin-bottom:12px}.empty h2{font-size:19px;font-weight:600;margin:0 0 8px}.empty p{max-width:390px;color:var(--muted);font-size:12px;line-height:1.8;margin:0 0 19px}.empty .button{margin:auto}.error{color:var(--warn);font-size:12px;line-height:1.7;margin:0 0 12px;max-width:600px}
aside{min-width:0;border-left:1px solid var(--line);background:var(--panel);padding:29px 24px;overflow:auto}.aside-title{font-size:10px;letter-spacing:.17em;color:var(--accent);font-weight:700;text-transform:uppercase;margin:0 0 20px}.aside-empty{font-size:12px;line-height:1.8;color:var(--muted)}.meta-label{display:block;font-size:10px;letter-spacing:.08em;color:var(--muted);margin:23px 0 8px}.meta-value{font-size:13px;line-height:1.7;overflow-wrap:anywhere}.detail-name{font-size:20px;font-weight:620;line-height:1.35;overflow-wrap:anywhere}.path{font-family:"SFMono-Regular",Consolas,monospace;color:#b9dfd9;font-size:11px;line-height:1.7;overflow-wrap:anywhere;background:#111a1c;border:1px solid var(--line);border-radius:8px;padding:10px}.aside-actions{display:flex;gap:8px;margin-top:12px}.aside-actions .button{width:100%}.note{font-size:12px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.children-list{list-style:none;padding:0;margin:0}.children-list li{font-size:11px;color:#c1d5d5;border-bottom:1px solid #2c3c3f;padding:8px 0;overflow-wrap:anywhere}
.drop-mask{position:fixed;inset:12px;z-index:10;display:grid;place-items:center;border:2px dashed var(--accent);border-radius:16px;background:#142f2ff2;color:#ddf9f1;font-size:21px;font-weight:600;pointer-events:none}
@media(max-width:790px){.workspace{grid-template-columns:1fr;height:auto;min-height:calc(100vh - 70px)}main{min-height:65vh}aside{border-left:0;border-top:1px solid var(--line);min-height:160px}.stats{width:100%;margin:0}.intro h1{font-size:22px}}
@media(max-width:480px){header{padding:14px 16px}.brand strong{font-size:13px}.brand span{font-size:10px}.mark{width:32px;height:32px}.actions .button{padding:8px 10px}.intro{margin-bottom:15px}main{padding:21px 14px}.toolbar .button{flex:1}.search{max-width:none}.tree-content{padding:18px 13px 35px}}
</style>
</head>
<body>
<div class="app">
 <header>
  <div class="mark" aria-hidden="true">⌁</div>
  <div class="brand"><strong>ASTRA</strong><span>分组树查看器</span></div>
  <div class="actions"><button id="openButton" class="button primary" type="button">打开 groups.json</button></div>
  <input id="fileInput" type="file" accept=".json,application/json" hidden>
 </header>
 <div class="workspace">
  <main>
   <div class="intro"><div class="intro-copy"><div class="eyebrow">Group structure</div><h1>分组树</h1><p id="fileLabel" class="filename">选择或拖入 groups.json，查看语义与空间分组。</p></div></div>
   <div class="toolbar">
    <input id="search" class="search" type="search" placeholder="搜索分组名称、路径或备注" aria-label="搜索分组" disabled>
    <button id="expandAll" class="button" type="button" disabled>全部展开</button>
    <button id="collapseAll" class="button" type="button" disabled>全部收起</button>
    <span id="stats" class="stats" role="status">尚未加载</span>
   </div>
   <p id="error" class="error" role="alert" hidden></p>
   <section id="treePanel" class="tree-panel" aria-label="分组树">
    <div id="empty" class="empty"><div><div class="empty-icon" aria-hidden="true">◇</div><h2 id="emptyTitle">打开分组文件</h2><p id="emptyMessage">直接拖入 groups.json，或选择本地文件。页面可以离线使用。</p><button id="emptyOpen" class="button primary" type="button">选择 JSON 文件</button></div></div>
    <div id="treeContent" class="tree-content" hidden><ul id="treeRoot" class="tree-root" role="tree" aria-label="分组层级"></ul></div>
   </section>
  </main>
  <aside aria-label="分组详情">
   <h2 class="aside-title">当前分组</h2>
   <div id="detailEmpty" class="aside-empty">选择树上的分组，查看完整路径、备注和下级分组。</div>
   <div id="detail" hidden>
    <div id="detailName" class="detail-name"></div>
    <span class="meta-label">完整路径</span><div id="detailPath" class="path"></div>
    <div class="aside-actions"><button id="copyPath" class="button" type="button">复制路径</button></div>
    <span class="meta-label">下级分组</span><div id="detailChildren" class="meta-value"></div>
    <span class="meta-label">备注</span><div id="detailNote" class="note"></div>
   </div>
  </aside>
 </div>
</div>
<div id="dropMask" class="drop-mask" hidden>松开以打开 groups.json</div>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const ui = Object.fromEntries(['openButton','emptyOpen','fileInput','fileLabel','search','expandAll','collapseAll','stats','empty','emptyTitle','emptyMessage','error','treeContent','treeRoot','detailEmpty','detail','detailName','detailPath','detailChildren','detailNote','copyPath','dropMask'].map(id => [id,$(id)]));
  let documentData = null;
  let selectedPath = null;
  let expanded = new Set();
  let groupIndex = new Map();
  let dragDepth = 0;

  function validate(data) {
    if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('顶层必须是 JSON 对象。');
    if (!['character','other'].includes(data.subject)) throw new Error('subject 必须是 character 或 other。');
    if (!Array.isArray(data.groups)) throw new Error('顶层 groups 必须是数组。');
    let total = 0, leaves = 0, maxDepth = 0;
    const index = new Map();
    function walk(groups, parent, depth) {
      if (depth > 50) throw new Error('分组层级超过 50 层，请检查是否误生成了递归结构。');
      const siblings = new Set();
      for (const group of groups) {
        if (!group || typeof group !== 'object' || Array.isArray(group)) throw new Error(`“${parent || '根目录'}”下有非对象分组。`);
        if (typeof group.name !== 'string' || !/^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$/.test(group.name)) throw new Error(`“${parent || '根目录'}”下的 name 必须是小写英文 snake_case。`);
        if (siblings.has(group.name)) throw new Error(`“${parent || '根目录'}”下重复出现 ${group.name}。`);
        siblings.add(group.name);
        const path = parent ? `${parent}/${group.name}` : group.name;
        if (!Array.isArray(group.groups)) throw new Error(`${path} 缺少 groups 数组。`);
        if (group.note !== undefined && typeof group.note !== 'string') throw new Error(`${path} 的 note 必须是文字。`);
        if (group.display_order !== undefined && (typeof group.display_order !== 'number' || !Number.isFinite(group.display_order))) throw new Error(`${path} 的 display_order 必须是有限数值。`);
        const unknown = Object.keys(group).filter(key => !['name','groups','note','display_order'].includes(key));
        if (unknown.length) throw new Error(`${path} 含有当前分组格式之外的字段：${unknown.join('、')}。`);
        total++;
        if (total > 5000) throw new Error('分组超过 5000 个，无法在此页面流畅显示。');
        if (!group.groups.length) leaves++;
        maxDepth = Math.max(maxDepth,depth);
        index.set(path,group);
        walk(group.groups,path,depth+1);
      }
    }
    walk(data.groups,'',1);
    return {total,leaves,maxDepth,index};
  }

  function setError(message) {
    ui.error.textContent = message;
    ui.error.hidden = false;
    if (!documentData) {
      ui.empty.hidden = false;
      ui.treeContent.hidden = true;
    }
  }

  async function loadFile(file) {
    if (!file) return;
    try {
      if (file.size > 5_000_000) throw new Error('文件超过 5 MB，请检查内容。');
      const parsed = JSON.parse(await file.text());
      const result = validate(parsed);
      documentData = parsed;
      groupIndex = result.index;
      expanded = new Set([...groupIndex.keys()]);
      selectedPath = null;
      ui.error.hidden = true;
      ui.search.value = '';
      ui.search.disabled = false;
      ui.expandAll.disabled = false;
      ui.collapseAll.disabled = false;
      ui.fileLabel.textContent = file.name;
      ui.fileLabel.title = file.name;
      ui.stats.textContent = `${parsed.subject === 'character' ? '角色' : '其他对象'} · ${result.total} 个分组 · ${result.leaves} 个末级分组 · ${result.maxDepth} 层`;
      renderTree();
      renderDetail();
    } catch (error) {
      setError(`无法读取 ${file.name}：${error.message}`);
    }
    ui.fileInput.value = '';
  }

  function filteredNode(group,path,query,showAll = false) {
    const matches = query && (group.name.toLowerCase().includes(query) || (group.note || '').toLowerCase().includes(query) || path.toLowerCase().includes(query));
    const children = group.groups.map(child => filteredNode(child,`${path}/${child.name}`,query,showAll || matches)).filter(Boolean);
    if (query && !showAll && !matches && !children.length) return null;
    return {group,path,children,matches};
  }

  function makeNode(entry,searching) {
    const {group,path,children,matches} = entry;
    const li = document.createElement('li');
    li.dataset.path = path;
    li.setAttribute('role','treeitem');
    const hasChildren = children.length > 0;
    const isOpen = hasChildren && (searching || expanded.has(path));
    if (hasChildren) li.setAttribute('aria-expanded',String(isOpen));
    const row = document.createElement('div');
    row.className = 'node-row' + (matches ? ' match' : '');
    if (hasChildren) {
      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'toggle';
      toggle.textContent = isOpen ? '⌄' : '›';
      toggle.setAttribute('aria-label',`${isOpen ? '收起' : '展开'} ${group.name}`);
      toggle.disabled = searching;
      toggle.addEventListener('click',() => {
        if (expanded.has(path)) expanded.delete(path); else expanded.add(path);
        const open = expanded.has(path);
        toggle.textContent = open ? '⌄' : '›';
        toggle.setAttribute('aria-label',`${open ? '收起' : '展开'} ${group.name}`);
        li.setAttribute('aria-expanded',String(open));
        childList.hidden = !open;
      });
      row.append(toggle);
    } else {
      const spacer = document.createElement('span');
      spacer.className = 'toggle-spacer';
      row.append(spacer);
    }
    const main = document.createElement('button');
    main.type = 'button';
    main.className = 'node-main' + (hasChildren ? '' : ' leaf') + (selectedPath === path ? ' selected' : '');
    main.setAttribute('aria-label',`${path}${group.note ? '，有备注' : ''}`);
    const name = document.createElement('span');
    name.className = 'node-name';
    name.textContent = group.name;
    main.append(name);
    if (group.note) {
      const note = document.createElement('span');
      note.className = 'note-mark';
      note.textContent = '✎';
      note.title = '有备注';
      main.append(note);
    }
    if (group.groups.length) {
      const count = document.createElement('span');
      count.className = 'node-count';
      count.textContent = String(group.groups.length);
      count.title = '直接下级分组数';
      main.append(count);
    }
    main.addEventListener('click',() => {
      selectedPath = path;
      document.querySelectorAll('.node-main.selected').forEach(node => node.classList.remove('selected'));
      main.classList.add('selected');
      renderDetail();
    });
    row.append(main);
    li.append(row);
    if (hasChildren) {
      var childList = document.createElement('ul');
      childList.setAttribute('role','group');
      childList.hidden = !isOpen;
      children.forEach(child => childList.append(makeNode(child,searching)));
      li.append(childList);
    }
    return li;
  }

  function renderTree() {
    ui.treeRoot.replaceChildren();
    if (!documentData || !documentData.groups.length) {
      ui.empty.hidden = false;
      ui.treeContent.hidden = true;
      ui.emptyTitle.textContent = documentData ? '没有分组' : '打开分组文件';
      ui.emptyMessage.textContent = documentData ? '这个文件的 groups 为空，没有可显示的分组。' : '直接拖入 groups.json，或选择本地文件。页面可以离线使用。';
      return;
    }
    const query = ui.search.value.trim().toLowerCase();
    ui.expandAll.disabled = Boolean(query);
    ui.collapseAll.disabled = Boolean(query);
    const entries = documentData.groups.map(group => filteredNode(group,group.name,query)).filter(Boolean);
    if (!entries.length) {
      ui.empty.hidden = false;
      ui.treeContent.hidden = true;
      ui.emptyTitle.textContent = '没有搜索结果';
      ui.emptyMessage.textContent = `没有找到“${ui.search.value.trim()}”对应的分组。`;
      return;
    }
    const fragment = document.createDocumentFragment();
    entries.forEach(entry => fragment.append(makeNode(entry,Boolean(query))));
    ui.treeRoot.append(fragment);
    ui.empty.hidden = true;
    ui.treeContent.hidden = false;
  }

  function renderDetail() {
    const group = groupIndex.get(selectedPath);
    ui.detail.hidden = !group;
    ui.detailEmpty.hidden = Boolean(group);
    if (!group) return;
    ui.detailName.textContent = group.name;
    ui.detailPath.textContent = selectedPath;
    ui.detailChildren.textContent = group.groups.length ? group.groups.map(child => child.name).join('、') : '无 · 末级分组';
    ui.detailNote.textContent = group.note || '无';
  }

  ui.openButton.addEventListener('click',() => ui.fileInput.click());
  ui.emptyOpen.addEventListener('click',() => ui.fileInput.click());
  ui.fileInput.addEventListener('change',() => loadFile(ui.fileInput.files[0]));
  ui.search.addEventListener('input',renderTree);
  ui.expandAll.addEventListener('click',() => {expanded = new Set(groupIndex.keys());renderTree();});
  ui.collapseAll.addEventListener('click',() => {expanded.clear();renderTree();});
  ui.copyPath.addEventListener('click',async () => {
    if (!selectedPath) return;
    try {
      await navigator.clipboard.writeText(selectedPath);
      ui.copyPath.textContent = '已复制';
      setTimeout(() => {ui.copyPath.textContent = '复制路径';},1400);
    } catch {
      ui.copyPath.textContent = '无法复制，请手动选择路径';
      setTimeout(() => {ui.copyPath.textContent = '复制路径';},2200);
    }
  });
  document.addEventListener('dragenter',event => {
    if (![...(event.dataTransfer?.types || [])].includes('Files')) return;
    event.preventDefault();
    dragDepth++;
    ui.dropMask.hidden = false;
  });
  document.addEventListener('dragover',event => {
    if ([...(event.dataTransfer?.types || [])].includes('Files')) event.preventDefault();
  });
  document.addEventListener('dragleave',event => {
    event.preventDefault();
    dragDepth = Math.max(0,dragDepth-1);
    if (!dragDepth) ui.dropMask.hidden = true;
  });
  document.addEventListener('drop',event => {
    event.preventDefault();
    dragDepth = 0;
    ui.dropMask.hidden = true;
    const file = event.dataTransfer?.files?.[0];
    if (file) loadFile(file);
  });
})();
</script>
</body>
</html>

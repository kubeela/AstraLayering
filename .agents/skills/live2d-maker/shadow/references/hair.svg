<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1280" viewBox="0 0 2048 1280">
<defs><style>text{font-family:DejaVu Sans,sans-serif;fill:#263747}.title{font-size:48px;font-weight:bold}.h{font-size:30px;font-weight:bold}.s{font-size:24px}.hint{font-size:22px;fill:#586a78}</style>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fff"/><path d="M0 0h12v12H0zM12 12h12v12H12z" fill="#eaf0f5"/></pattern>
<path id="face" d="M105 155 Q125 72 249 92 Q355 103 368 171 L358 305 Q332 402 238 431 Q140 405 112 320Z"/>
<path id="a" d="M115 18 Q182 0 238 24 L273 242 Q246 223 228 169 L201 222 Q174 194 166 149 L131 239 Q82 174 115 18Z"/>
<path id="b" d="M213 24 Q292 0 360 38 Q411 155 366 273 L325 191 Q312 259 284 269 L269 156 Q243 227 220 230Z"/>
<clipPath id="receive"><use href="#face"/></clipPath>
<g id="features" fill="none" stroke="#554952" stroke-width="6" stroke-linecap="round"><path d="M154 255q27-24 52 0 M271 255q27-24 52 0 M209 358q27 15 49 0"/><circle cx="184" cy="262" r="9" fill="#668a9a"/><circle cx="296" cy="262" r="9" fill="#668a9a"/></g></defs>
<rect width="2048" height="1280" fill="#f5f8fb"/>
<text x="70" y="82" class="title">Hair cast: independent paint, shared face clipping</text>
<text x="70" y="125" class="s">Structure study based on Milly front-hair shadows and faceM. Original diagram, not model artwork.</text>
<g transform="translate(60 166)"><rect width="580" height="492" rx="18" fill="url(#grid)"/><text x="30" y="46" class="h">1  Full overlapping hair casts</text><g transform="translate(55 72)"><use href="#face" fill="none" stroke="#446c8d" stroke-width="4" stroke-dasharray="10 8"/><use href="#a" fill="#d0a7ad"/><use href="#b" fill="#d0a7ad"/></g><text x="30" y="455" class="hint">Keep hidden roots and moving tips.</text></g>
<g transform="translate(734 166)"><rect width="580" height="492" rx="18" fill="url(#grid)"/><text x="30" y="46" class="h">2  Same normal opaque color</text><g transform="translate(55 72)"><use href="#face" fill="#f4d4c6"/><g clip-path="url(#receive)"><use href="#a" fill="#d0a7ad"/><use href="#b" fill="#d0a7ad"/></g><use href="#features"/></g><text x="30" y="455" class="hint">No double darkening in interior overlap.</text></g>
<g transform="translate(1408 166)"><rect width="580" height="492" rx="18" fill="url(#grid)"/><text x="30" y="46" class="h">3  Repeated translucent casts</text><g transform="translate(55 72)"><use href="#face" fill="#f4d4c6"/><g clip-path="url(#receive)"><use href="#a" fill="#81565f" opacity=".42"/><use href="#b" fill="#81565f" opacity=".42"/></g><use href="#features"/></g><text x="30" y="455" class="hint">Check overlap darkening against reference.</text></g>
<text x="70" y="730" class="h">Paint order: face color → cast paint → required face lines / features → front hair</text>
<g transform="translate(130 790)"><use href="#face" fill="#f4d4c6"/><g clip-path="url(#receive)"><use href="#a" fill="#d0a7ad" transform="translate(-35 15)"/><use href="#b" fill="#d0a7ad" transform="translate(26 -12)"/></g><use href="#features"/><g transform="translate(0 -18) scale(1 .80)"><use href="#a" fill="#678ba6"/><use href="#b" fill="#678ba6"/></g><text x="0" y="460" class="s">Independent shadow offsets; face stays.</text></g>
<g transform="translate(790 796)"><rect width="1120" height="380" rx="18" fill="#fff"/><text x="35" y="55" class="h">Verified model decisions, not fixed artistic rules</text><text x="35" y="120" class="s">Separate front-hair shadow meshes share faceM.</text><text x="35" y="170" class="s">Front-hair shadows use normal blend and full opacity.</text><text x="35" y="220" class="s">Shadow-specific parameters can move the cast independently.</text><text x="35" y="280" class="hint">Match the character's painted edge and color. Antialiasing still needs review.</text><text x="35" y="324" class="hint">This does not require an eye/mouth region to be exempt from lighting.</text></g>
</svg>

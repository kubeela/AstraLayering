id: body_line_art
run: .
worker: refinement_drawing
inputs:
  reference: inputs.reference
  parts: inputs.parts
  svg: inputs.svg
  guide: inputs.line_art
  preview_tool:
    asset: ../../../../../../../agent-tools/svg_preview.py
outputs:
  svg: refinement/groups/{group.id}/1.身体构型与衔接线稿/character.svg
  comparison: refinement/groups/{group.id}/1.身体构型与衔接线稿/构型与衔接对照.png
review:
  run: review/
  inputs:
    reference: inputs.reference
    parts: inputs.parts
    candidate: self.svg
    comparison: self.comparison
    preview_tool: inputs.preview_tool
  outputs:
    report: reviews/refinement/{group.id}/line-art/审查.md
